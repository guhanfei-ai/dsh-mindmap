# Dependabot 配置：自动为依赖与 GitHub Actions 提交升级 PR。
version: 2
updates:
  # 1) npm 依赖：每周检查一次，最多同时打开 5 个升级 PR。
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # 2) GitHub Actions：每月检查一次，让工作流使用的 action 版本保持更新。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # 发布前暂缓大版本跳级（checkout/setup-node 4→7）：避免 CI 基建变更
    # 混入发布窗口；大版本升级决策推到下一版单独评估。
    ignore:
      - dependency-name: actions/checkout
        versions: [">=5"]
      - dependency-name: actions/setup-node
        versions: [">=5"]
